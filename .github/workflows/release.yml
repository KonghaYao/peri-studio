name: Peri Studio Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  native-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - name: Verify and build Web client
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun audit
          bun run test
          bunx playwright install --with-deps chromium
          bun run test:browser
          bun run build
      - name: Install Rust quality components
        run: rustup component add rustfmt clippy
      - name: Install exact cargo-deny policy engine
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Verify native workspace
        run: |
          cargo deny check
          cargo fmt --all --check
          cargo test --workspace --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo build --release --locked --bin peri-studio
      - name: Package reproducible native archive
        run: scripts/package-release.sh
      - name: Verify clean source provenance
        run: scripts/verify-release.sh --require-clean --expected-revision "$GITHUB_SHA" dist/peri-studio-*.tar.gz
      - name: Generate SPDX software bill of materials
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: dist/peri-studio.spdx.json
      - name: Attest archive provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/peri-studio-*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: peri-studio-linux
          path: |
            dist/peri-studio-*.tar.gz
            dist/peri-studio-*.sha256
            dist/peri-studio.spdx.json
          if-no-files-found: error
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
