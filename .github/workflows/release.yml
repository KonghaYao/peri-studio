name: Peri Studio Release

on:
  push:
    tags: ['peri-studio-v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - name: Verify release tag matches the workspace version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(sed -n '/^\[workspace.package\]/,/^\[/ s/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          test "$GITHUB_REF_NAME" = "peri-studio-v${version}"
      - name: Audit locked Web dependencies
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun audit
      - name: Install exact cargo-deny policy engine
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Audit Rust advisories, licenses and sources
        run: cargo deny check

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - name: Test and build Web client
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run test
          bun run build
      - uses: actions/upload-artifact@v4
        with:
          name: release-web-dist
          path: web/dist
          if-no-files-found: error

  native:
    needs: [policy, web]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-x86_64
            target: x86_64-unknown-linux-gnu
            executable: peri-studio
          - os: macos-14
            artifact: macos-arm64
            target: aarch64-apple-darwin
            executable: peri-studio
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: release-web-dist
          path: web/dist
      - name: Install Rust quality components and target
        run: |
          rustup component add rustfmt clippy
          rustup target add ${{ matrix.target }}
      - name: Verify native workspace
        run: |
          cargo fmt --all --check
          cargo build --workspace --bins --locked
          cargo test --workspace --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo build --release --locked --target ${{ matrix.target }} --bin peri-studio
      - name: Package binary twice and compare reproducible assets
        shell: bash
        run: |
          scripts/package-release-binary.sh --bin-dir "target/${{ matrix.target }}/release" --out-dir dist/first --target "${{ matrix.target }}"
          scripts/package-release-binary.sh --bin-dir "target/${{ matrix.target }}/release" --out-dir dist/second --target "${{ matrix.target }}"
          first="$(find dist/first -type f ! -name '*.sha256' ! -name '*.metadata')"
          second="$(find dist/second -type f ! -name '*.sha256' ! -name '*.metadata')"
          cmp "$first" "$second"
          mkdir -p dist
          cp dist/first/* dist/
      - name: Verify clean source provenance
        shell: bash
        run: |
          asset="$(find dist -maxdepth 1 -type f ! -name '*.sha256' ! -name '*.metadata' ! -name '*.json')"
          scripts/verify-release-binary.sh --require-clean --expected-revision "$GITHUB_SHA" "$asset"

      - name: Generate SPDX software bill of materials
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: dist/peri-studio-${{ matrix.artifact }}.spdx.json
      - name: Attest Unix binary provenance
        if: runner.os != 'Windows'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/peri-studio-*-${{ matrix.target }}
      - name: Attest Windows binary provenance
        if: runner.os == 'Windows'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/peri-studio-*-${{ matrix.target }}.exe
      - uses: actions/upload-artifact@v4
        with:
          name: peri-studio-${{ matrix.artifact }}
          path: |
            dist/peri-studio-*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: peri-studio-*
          path: dist
          merge-multiple: true
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp scripts/install.sh dist/
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
