name: Peri Studio Release

on:
  push:
    tags: ['peri-studio-v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - name: Verify release tag matches the workspace version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(sed -n '/^\[workspace.package\]/,/^\[/ s/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          test "$GITHUB_REF_NAME" = "peri-studio-v${version}"
      - name: Audit locked Web dependencies
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun audit
      - name: Install exact cargo-deny policy engine
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Audit Rust advisories, licenses and sources
        run: cargo deny check

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - name: Test and build Web client
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run test
          bunx playwright install --with-deps chromium
          bun run test:browser
          bun run build
      - uses: actions/upload-artifact@v4
        with:
          name: release-web-dist
          path: web/dist
          if-no-files-found: error

  native:
    needs: [policy, web]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux
          - os: macos-14
            artifact: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: release-web-dist
          path: web/dist
      - name: Install Rust quality components
        run: rustup component add rustfmt clippy
      - name: Verify native workspace
        run: |
          cargo fmt --all --check
          cargo test --workspace --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo build --release --locked --bin peri-studio
      - name: Package twice and compare reproducible archives
        run: |
          scripts/package-release.sh --out-dir dist/first
          scripts/package-release.sh --out-dir dist/second
          first="$(find dist/first -name '*.tar.gz' -type f)"
          second="$(find dist/second -name '*.tar.gz' -type f)"
          cmp "$first" "$second"
          cp dist/first/* dist/
      - name: Verify clean source provenance
        run: scripts/verify-release.sh --require-clean --expected-revision "$GITHUB_SHA" dist/peri-studio-*.tar.gz
      - name: Generate SPDX software bill of materials
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: dist/peri-studio-${{ matrix.artifact }}.spdx.json
      - name: Attest archive provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/peri-studio-*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: peri-studio-${{ matrix.artifact }}
          path: |
            dist/peri-studio-*.tar.gz
            dist/peri-studio-*.sha256
            dist/peri-studio-${{ matrix.artifact }}.spdx.json
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: peri-studio-*
          path: dist
          merge-multiple: true
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
