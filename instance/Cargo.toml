[package]
name = "peri-instance"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "peri-studio instance：outbound 连 server、管理 ACP 进程树、透明转发 + 断线缓冲（由原 peri-studio 单机版演化）"

[[bin]]
name = "test-child"
path = "src/bin/test_child.rs"
test = false  # 不是测试目标，是集成测试用的假 ACP 进程

[lib]
name = "peri_instance"
path = "src/lib.rs"

[dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
tokio-util = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true, features = ["derive", "rc"] }
serde_json = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true, features = ["v4", "v7", "serde"] }
chrono = { workspace = true, features = ["serde"] }
tokio-tungstenite = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
hkdf = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
libc = { workspace = true }
fs2 = { workspace = true }
peri-studio-proto = { path = "../proto", version = "0.3.3" }
portable-pty = { workspace = true }
agent-client-protocol-schema = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
serial_test = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt", "json"] }
