# peri-studio —— 单一产品二进制 + 内部运行时库
# 架构基准：docs/architecture.md §3.2/§12

[workspace]
members = ["app", "proto", "server", "instance", "realtime-voice"]
resolver = "2"

[workspace.package]
version = "0.3.1"
edition = "2021"
license = "Apache-2.0"

# ============================================================================
# Workspace-wide dependency declarations
# 单一事实源 — 所有 crate 通过 `workspace = true` 引用
# ============================================================================

[workspace.dependencies]
# --- Async runtime ---
tokio = { version = "1", features = ["full", "test-util"] }  # test-util 供时间暂停测试（§12）
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"
async-trait = "0.1"

# --- Serde ecosystem ---
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"

# --- Logging ---
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "fmt",
    "json",
] }

# --- CLI ---
clap = { version = "4", features = ["derive", "env"] }

# --- Error handling ---
anyhow = "1.0"
thiserror = "2"

# --- Utilities ---
uuid = { version = "1", features = ["v4", "v5", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs-next = "2"
url = "2"

# --- WebSocket (ws server + client) ---
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }

# --- Realtime voice（隔离 crate，未接入产品二进制）---
cpal = "0.18"
hound = "3.5"

# --- Crypto / 编码（§9.2 双向认证、§8.4 CRC） ---
sha2 = "0.10"  # digest 0.10；hmac/hkdf 取 0.12 以保持 digest 大版本一致
hmac = "0.12"
hkdf = "0.12"
base64 = "0.23.1"
rand = "0.10"  # CSPRNG（默认 features 含 sys_rng）

# --- PTY（instance 终端宿主） ---
portable-pty = "0.9"

# --- Unix 进程组信号（instance 进程树 kill，§4.1） ---
libc = "0.2"
fs2 = "0.4"
crc32fast = "1.5"

# --- CRDT / 聚合层（§5 数据模型，server 侧 Y.Doc） ---
yrs = "0.27"

# --- Config / 解析 ---
toml = "0.8"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite"] }


# --- ACP 协议 schema ---
agent-client-protocol-schema = { version = "1.4", features = ["unstable_elicitation"] }

# --- Dev ---
tempfile = "3"
serial_test = "4.0.1"
